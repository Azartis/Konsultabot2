<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Konsultabot Tech Orb Favicon">
  <defs>
    <radialGradient id="orbGradientFavicon" cx="30%" cy="30%">
      <stop offset="0%" stop-color="#00FFF0"/>
      <stop offset="50%" stop-color="#4F8EFF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </radialGradient>
    <filter id="glowFavicon">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="64" height="64" fill="#000000"/>
  <circle cx="32" cy="32" r="22.4" fill="url(#orbGradientFavicon)" filter="url(#glowFavicon)"/>
