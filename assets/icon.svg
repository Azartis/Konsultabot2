<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Konsultabot Tech Holographic Orb Icon">
  <defs>
    <!-- Dark tech background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="50%" stop-color="#0F1625"/>
      <stop offset="100%" stop-color="#0A0E1A"/>
    </linearGradient>
    
    <!-- Outer glow gradient -->
    <radialGradient id="glowGradient" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#00FFF0" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#4F8EFF" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00FFF0" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Main orb gradient with tech colors -->
    <radialGradient id="orbGradient" cx="30%" cy="30%">
      <stop offset="0%" stop-color="#00FFF0"/>
      <stop offset="25%" stop-color="#4F8EFF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="75%" stop-color="#FF3B9A"/>
      <stop offset="100%" stop-color="#1A1F3A"/>
    </radialGradient>
    
    <!-- Tech highlight gradient -->
    <radialGradient id="highlightGradient" cx="30%" cy="30%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#00FFF0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Circuit pattern gradient -->
    <linearGradient id="circuitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFF0" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#4F8EFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.6"/>
    </linearGradient>
    
    <!-- Enhanced glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Tech pattern filter -->
    <filter id="techGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
